# Site-wide settings. Your content lives in the _data folder (see README.md).
title: Kiarash Aghakasiri
description: >-
  PhD student in Computing Science at the University of Alberta, working on
  reinforcement learning, programmatic policies and option discovery.
url: "https://kiarashk76.github.io"
author: Kiarash Aghakasiri

markdown: kramdown
kramdown:
  input: GFM
permalink: /blog/:year/:month/:title/

collections:
  ideas:
    output: true
    permalink: /ideas/:name/

defaults:
  - scope: { path: "", type: posts }
    values: { layout: post }
  - scope: { path: "", type: ideas }
    values: { layout: idea }

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - README.md
