---
layout: default
---
<article class="page post">
  <header class="page-header">
    <p class="kicker"><a href="{{ '/blog/' | relative_url }}">Blog</a> · <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time></p>
    <h1 class="page-title">{{ page.title }}</h1>
    {%- if page.subtitle %}<p class="lede">{{ page.subtitle }}</p>{% endif %}
    {%- if page.tags.size > 0 %}<div class="tags">{% for t in page.tags %}<span class="tag">{{ t }}</span>{% endfor %}</div>{% endif %}
  </header>
  <div class="prose">
    {{ content }}
  </div>
  <p class="back"><a href="{{ '/blog/' | relative_url }}">← All posts</a></p>
</article>
