---
layout: default
---
{%- assign d = site.data[page.data] -%}
<article class="page">
  <header class="page-header">
    {%- if d.subtitle %}<p class="kicker">{{ d.subtitle }}</p>{% endif %}
    <h1 class="page-title">{{ page.title }}</h1>
    {%- if d.intro %}<div class="lede">{{ d.intro | markdownify }}</div>{% endif %}
  </header>
  <div class="prose">
    {{ content }}
  </div>
</article>
